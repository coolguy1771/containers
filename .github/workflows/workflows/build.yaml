name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build containers
        run: |
          docker buildx build \
            --load \
            --pull \
            --progress=plain \
            -f apps/nginx/Dockerfile \
            -t nginx:${{ github.sha }} \
            .

      - name: Test containers
        run: |
          cd tests
          go test -v -run TestNginxBuild
